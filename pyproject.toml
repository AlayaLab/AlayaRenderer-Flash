[project]
name = "alayarenderer-flash"
version = "0.1.0"
description = "Real-time G-buffer-conditioned generative renderer with a playable SuperTuxKart demo"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Alaya Lab" }]
requires-python = ">=3.11,<3.14"
keywords = ["neural-rendering", "g-buffer", "video-diffusion", "real-time", "world-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # torch 2.11 is the newest release with CUDA 12.8 wheels (driver >= 570);
    # 2.12+ ships CUDA 13 only, which the deployment driver does not support.
    "torch>=2.11,<2.12",
    "torchvision>=0.26,<0.27",
    "diffusers>=0.42",
    "transformers>=5.20",
    "accelerate>=1.15",
    "huggingface-hub>=2.3",
    "kernels>=0.17",
    "safetensors>=0.8",
    "einops>=0.8",
    "ftfy>=6.3",
    "regex",
    "sentencepiece>=0.2",
    "numpy>=2",
    "pillow>=11",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "tqdm",
]

[project.optional-dependencies]
demo = ["opencv-python-headless>=4.10"]

[project.scripts]
alayarender-flash = "alayarenderer_flash.cli:main"

[project.urls]
Homepage = "https://alaya-renderer-flash.alayalab.ai"
Repository = "https://github.com/AlayaLab/AlayaRenderer-Flash"
Paper = "https://arxiv.org/abs/2607.18703"
Weights = "https://huggingface.co/AlayaLab/AlayaRenderer-Flash"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "pre-commit>=4"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Large modules ported verbatim from the deployed service; kept close to the
# validated source rather than reformatted wholesale.
"src/alayarenderer_flash/demo/*.py" = ["B", "UP", "E", "W"]
"src/alayarenderer_flash/models/*.py" = ["B", "UP"]
"src/alayarenderer_flash/models/kernels/*.py" = ["B", "UP", "E731"]
"src/alayarenderer_flash/pipeline/*.py" = ["B", "UP"]
"src/alayarenderer_flash/decoders/*.py" = ["B", "UP", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU and the released weights"]
